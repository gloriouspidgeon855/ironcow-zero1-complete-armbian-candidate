# Rockchip RK3568 quad core 4GB LPDDR4X 2.5GBe USB3 SATA
BOARD_NAME="IronCow Zero1"
BOARD_VENDOR="YXK"
BOARDFAMILY="rockchip64"
BOARD_MAINTAINER="gloriouspidgeon855"
PACKAGE_LIST_BOARD="libubootenv-tool pciutils smartmontools hdparm fastfetch ethtool iperf3 fio btop iotop-c mdadm tmux i2c-tools util-linux-extra"
PACKAGE_LIST_BOARD_REMOVE="fake-hwclock" # the board has a battery-backed RTC; fake-hwclock overrides it at every boot
INTRODUCED="2025"
BOOT_SOC="rk3568"
KERNEL_TARGET="current"
KERNEL_TEST_TARGET="current"
BOOT_FDT_FILE="rockchip/rk3568-ironcow-zero1.dtb"
SRC_EXTLINUX="no"
IMAGE_PARTITION_TABLE="gpt"
BSPFREEZE="yes" # hold the kernel, DTB and U-Boot packages: Armbian's own do not carry this board yet
FULL_DESKTOP="yes"
BOOT_LOGO="text"

BOOTBRANCH_BOARD="tag:v2026.07"
BOOTPATCHDIR="v2026.07"

BOOTCONFIG="ironcow-zero1-rk3568_defconfig"
BOOTDIR="u-boot-${BOARD}"

OVERLAY_PREFIX="rockchip-rk3568"

enable_extension "watchdog"

function post_family_config__uboot_config() {
	display_alert "$BOARD" "u-boot ${BOOTBRANCH_BOARD} overrides" "info"
	BOOTDELAY=1

	UBOOT_TARGET_MAP="BL31=${RKBIN_DIR}/$BL31_BLOB ROCKCHIP_TPL=${RKBIN_DIR}/${DDR_BLOB};;u-boot-rockchip.bin u-boot.itb idbloader.img"
	
	# Disable stuff from rockchip64_common; binman handles the heavy lifting
	unset uboot_custom_postprocess write_uboot_platform write_uboot_platform_mtd 

	# Write the binman-provided unified U-Boot image to the eMMC block device
	function write_uboot_platform() {
		display_alert "Writing U-Boot to eMMC" "bs=32k seek=1" "info"
		dd if=${1}/u-boot-rockchip.bin of=${2} bs=32k seek=1 conv=fsync
	}
	
	# write_uboot_platform_mtd is deliberately omitted because there is no SPI flash
}

function post_family_tweaks__ironcow_zero1_network_fix() {
	display_alert "Naming the 2.5 GbE port eth0" "IronCow Zero1" "info"
	
	mkdir -p "${SDCARD}"/etc/systemd/network/
	
	cat <<- EOF > "${SDCARD}"/etc/systemd/network/10-ironcow-nic.link
		[Match]
		# The RTL8125B, the board's only wired port
		Driver=r8169
		
		[Link]
		Name=eth0
		
		# U-Boot normally gives the port its MAC address through the device
		# tree, and this policy leaves such an address alone. It is a fallback:
		# if the port ever comes up with a random address, systemd replaces it
		# with a stable one so the address does not change on every boot.
		MACAddressPolicy=persistent
	EOF
}

function pre_config_uboot_target__ironcow_zero1_patch_rockchip_common_boot_order() {
	declare -a rockchip_uboot_targets=("usb" "mmc0" "scsi" "pxe" "dhcp")
	display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: adjust boot order to '${rockchip_uboot_targets[*]}'" "info"
	sed -i -e "s/#define BOOT_TARGETS.*/#define BOOT_TARGETS \"${rockchip_uboot_targets[*]}\"/" include/configs/rockchip-common.h
	regular_git diff -u include/configs/rockchip-common.h || true
}

function post_family_tweaks__ironcow_zero1_fwenv() {
	display_alert "Configuring fw_printenv map" "IronCow Zero1 (eMMC Offset 0x3F8000)" "info"
	
	mkdir -p "${SDCARD}"/etc/
	# Format: Device-Path / Offset / Size
	cat <<- EOF > "${SDCARD}"/etc/fw_env.config
		/dev/mmcblk0        0x3F8000        0x8000
	EOF
}
